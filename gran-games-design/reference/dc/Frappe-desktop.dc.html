<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Course de frappe, course (ordinateur)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&amp;family=Pixelify+Sans:wght@400;600;700&amp;family=VT323&amp;display=swap">
<style>
body{margin:0}
a{color:#F2B630}a:hover{color:#EFE8CC}
.asphalt{background-color:#2F3134;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.4px),radial-gradient(rgba(0,0,0,.18) 1px,transparent 1.4px);background-size:7px 7px,11px 11px}
.check{background:repeating-conic-gradient(#1B1D16 0 25%,#EFE8CC 0 50%) 0 0/14px 14px}
.key{transition:transform 120ms cubic-bezier(.23,1,.32,1),box-shadow 120ms cubic-bezier(.23,1,.32,1);cursor:pointer}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 #1B1D16 !important}
.key:focus-visible{outline:3px solid #F2B630;outline-offset:3px}
.car{transition:left 300ms linear}
@keyframes caret{50%{opacity:0}}
.caret{animation:caret 1s steps(1,end) infinite}
@media (prefers-reduced-motion: reduce){.caret{animation:none}.car{transition:none}}
</style>
</helmet>
<div class="asphalt" style="min-height: 960px; color: #EFE8CC; font-family: 'Bricolage Grotesque', sans-serif">
  <div style="max-width: 1320px; margin: 0 auto; padding: 12px 24px 0">
    <header style="background: #1F2022; border: 2px solid #4A4D52; border-radius: 16px; padding: 6px 8px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap">
      <button type="button" class="key" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px 0 10px; background: #EFE8CC; color: #1B1D16; border: 3px solid #1B1D16; border-radius: 10px; box-shadow: 0 3px 0 #000; font: 600 15px 'Bricolage Grotesque', sans-serif"><svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true" fill="none" stroke="#1B1D16" stroke-width="3" stroke-linecap="square"><path d="M11 3 5 9l6 6"/></svg>Abandonner</button>
      <nav aria-label="Fil d'Ariane" style="font-size: 15px; display: flex; gap: 8px; color: #C9CBCF"><span style="font-family: 'Pixelify Sans', monospace; color: #EFE8CC">Gran'Games</span><span aria-hidden="true">/</span><span>Course de frappe</span><span aria-hidden="true">/</span><span aria-current="page" style="color: #EFE8CC; font-weight: 600">Salle ZOOM</span></nav>
      <span style="margin-left: auto; font: 400 26px 'VT323', monospace; color: #F2B630">0:18</span>
    </header>
  </div>

  <main style="max-width: 1320px; margin: 0 auto; padding: 28px 24px 48px; display: flex; flex-direction: column; gap: 28px">
    <section aria-label="Piste" style="background: #26282B; border: 3px solid #1B1D16; border-radius: 12px; overflow: hidden; position: relative">
      <sc-for list="{{lanes}}" as="l" hint-placeholder-count="4">
        <div style="position: relative; height: 64px; border-bottom: 3px dashed #F2B630; display: flex; align-items: center">
          <span style="position: absolute; left: 14px; font: 400 28px 'VT323', monospace; color: #8E9197">{{l.lane}}</span>
          <div style="position: absolute; left: 56px; right: 60px; top: 0; bottom: 0">
            <span class="car" style="position: absolute; left: {{l.pos}}; top: 12px; height: 40px; padding: 0 10px 0 6px; transform: translateX(-100%); display: flex; align-items: center; gap: 8px; background: {{l.c}}; color: #1B1D16; border: 3px solid #1B1D16; border-radius: 8px 14px 14px 8px; font-weight: 700; white-space: nowrap; box-shadow: {{l.glow}}">
              <span aria-hidden="true" style="width: 22px; height: 22px; background: #1B1D16; color: {{l.c}}; display: grid; place-items: center; font: 700 13px 'Pixelify Sans', monospace">{{l.i}}</span>{{l.n}}<span style="font: 400 20px 'VT323', monospace">{{l.pct}}</span>
            </span>
          </div>
          <span class="check" aria-hidden="true" style="position: absolute; right: 24px; top: 0; bottom: 0; width: 28px"></span>
        </div>
      </sc-for>
    </section>

    <section aria-label="Phrase à taper" style="background: #1F2022; border: 3px solid #1B1D16; border-radius: 12px; padding: 32px 36px; display: flex; flex-direction: column; gap: 20px">
      <p style="margin: 0; font-family: 'VT323', monospace; font-size: 46px; line-height: 1.35; letter-spacing: 0.01em">
        <sc-for list="{{chars}}" as="ch" hint-placeholder-count="60"><span class="{{ch.cls}}" style="color: {{ch.fg}}; background: {{ch.bg}}; white-space: pre">{{ch.c}}</span></sc-for>
      </p>
      <label for="fr-in" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Tape la phrase</label>
      <input id="fr-in" aria-describedby="fr-help" style="position: absolute; opacity: 0; width: 1px; height: 1px">
      <p id="fr-help" style="margin: 0; font-size: 15px; color: #C9CBCF">Une faute bloque la voiture : efface et corrige pour avancer. Les lettres changent de couleur, rien ne bouge (pas d'animation sur la frappe).</p>
    </section>

    <section aria-label="Tes chiffres" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px">
      <div style="background: #F2B630; color: #1B1D16; border: 3px solid #1B1D16; border-radius: 10px; padding: 16px"><span style="font-size: 14px; font-weight: 600">Vitesse</span><br><span style="font: 400 56px 'VT323', monospace; line-height: 0.9">[n] mpm</span></div>
      <div style="background: #EFE8CC; color: #1B1D16; border: 3px solid #1B1D16; border-radius: 10px; padding: 16px"><span style="font-size: 14px; font-weight: 600">Précision</span><br><span style="font: 400 56px 'VT323', monospace; line-height: 0.9">[n] %</span></div>
      <div style="background: #EFE8CC; color: #1B1D16; border: 3px solid #1B1D16; border-radius: 10px; padding: 16px"><span style="font-size: 14px; font-weight: 600">Position</span><br><span style="font: 400 56px 'VT323', monospace; line-height: 0.9">2e / 4</span></div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    var lanes = [
      { lane: '1', n: 'Léa', i: 'L', c: '#F2B630', pos: '62%', pct: '62%', glow: 'none' },
      { lane: '2', n: 'Amir', i: 'A', c: '#F28AA6', pos: '48%', pct: '48%', glow: '0 0 0 3px #EFE8CC' },
      { lane: '3', n: 'Yanis', i: 'Y', c: '#7FB342', pos: '41%', pct: '41%', glow: 'none' },
      { lane: '4', n: 'Sofia', i: 'S', c: '#6FA0E8', pos: '23%', pct: '23%', glow: 'none' }
    ];
    var s = 'Le chat de la voisine a encore volé une chaussette sur le balcon.';
    var done = 31, err = 31;
    var chars = s.split('').map(function (c, i) {
      if (i < done) return { c: c, fg: '#9FD36A', bg: 'transparent', cls: '' };
      if (i === err) return { c: c === ' ' ? '␣' : c, fg: '#EFE8CC', bg: '#B83A24', cls: '' };
      if (i === err + 1) return { c: c, fg: '#1B1D16', bg: '#F2B630', cls: 'caret' };
      return { c: c, fg: '#A9ACB2', bg: 'transparent', cls: '' };
    });
    return { lanes: lanes, chars: chars };
  }
}
</script>
</body>
</html>
